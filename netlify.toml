# Netlify settings for the ScamGuard frontend (a static Vite build).
# The only value you type in is VITE_API_URL (your Render API address), under
# Site configuration > Environment variables.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Privacy Policy has its own address. Serve the app for it, so a refresh or a shared
# link works. "200" is a rewrite: the address bar keeps /privacy.
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# The sha256 in script-src allows only the small theme script in index.html (no flash of the
# wrong theme). If that script changes, its hash must change too: src/__tests__/privacy-theme.test.tsx checks it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-P2/d6rvY9OwKjijKCz2qRfFoTPAmEYSw3CbnRGFjRNA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# File names carry a content hash, so they can be cached for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
